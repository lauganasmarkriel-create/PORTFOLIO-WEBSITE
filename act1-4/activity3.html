<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Activity 3</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: Arial, sans-serif;
                background: #f7f7f7;
            }
            h1 {
                text-align: center;
                margin: 1.2rem 0;
                color: #222;
            }
            table {
                width: 100%;
                max-width: 1024px;
                margin: 0 auto 2rem;
                border-collapse: collapse;
                background: #fff;
                box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            }
            td {
                border: 1px solid #ddd;
                padding: 0.5rem;
                vertical-align: middle;
            }
            img {
                width: 100%;
                height: 220px;
                object-fit: cover;
                display: block;
            }
            .caption {
                font-weight: bold;
                color: #333;
                padding: 0.8rem 0;
            }
        </style>
    </head>
<body>
    <h1>Activity 3: Rally Car Gallery</h1>
    <table>
        <tr height="200px">
            <td><img src="images/rlly.png" alt="Audi Quattro"></td>
            <td><img src="images/dl.png"   alt="Lancia Delta S4"></td>
            <td><img src="images/sim.png"  alt="Subaru Impreza"></td>
        </tr>
        <tr class="caption">
            <td>Audi Quattro</td>
            <td>Lancia Delta S4</td>
            <td>Subaru Impreza</td>
        </tr>
        <tr height="200px">
            <td><img src="images/ff.png"  alt="Ford Fiesta"></td>
            <td><img src="images/sbr.png" alt="Subaru STI"></td>
            <td><img src="images/gry.png" alt="Toyota GR Yaris"></td>
        </tr>
        <tr height="50px">
            <td>Ford Fiesta</td>
            <td>Subaru STI</td>
            <td>Toyota GR Yaris</td>
        </tr>
    </table>
</body>
</html>
