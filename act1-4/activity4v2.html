<!DOCTYPE html>
<html lang="en">
<head>
    <title>Activity 4v2</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            color: #b8860b;
            margin-top: 40px;
        }

        form {
            width: 500px;
            margin: 30px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-top: 6px solid #d4af37;
        }

        table {
            width: 100%;
        }

        td {
            padding: 10px;
            vertical-align: top;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: #d4af37;
            box-shadow: 0 0 5px rgba(212,175,55,0.5);
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: 0.3s;
        }

        button[type="submit"] {
            background-color: #d4af37;
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #b8860b;
        }

        button[type="reset"] {
            background-color: #ffffff;
            border: 2px solid #d4af37;
            color: #b8860b;
        }

        button[type="reset"]:hover {
            background-color: #d4af37;
            color: white;
        }
    </style>

</head>
<body>

    <h2>User Information Form</h2>

    <form action="" method="post">
        <table>

            <tr>
                <td><label for="fname">First Name:</label></td>
                <td><input type="text" id="fname" name="firstname" required></td>
            </tr>

            <tr>
                <td><label for="lname">Last Name:</label></td>
                <td><input type="text" id="lname" name="lastname" required></td>
            </tr>

            <tr>
                <td><label for="age">Age:</label></td>
                <td><input type="number" name="age" id="age"></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                    <input type="radio" name="gender" value="other"> Other
                </td>
            </tr>

            <tr>
                <td>Hobbies:</td>
                <td>
                    <input type="checkbox" name="hobby[]" value="reading"> Reading<br>
                    <input type="checkbox" name="hobby[]" value="traveling"> Traveling<br>
                    <input type="checkbox" name="hobby[]" value="gaming"> Gaming<br>
                    <input type="checkbox" name="hobby[]" value="cooking"> Cooking<br>
                    <input type="checkbox" name="hobby[]" value="sports"> Sports
                </td>
            </tr>

            <tr>
                <td><label for="year-level">Year Level:</label></td>
                <td>
                    <select name="year-level" id="year-level">
                        <option value="1st-year">1st Year</option>
                        <option value="2nd-year">2nd Year</option>
                        <option value="3rd-year">3rd Year</option>
                        <option value="4th-year">4th Year</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
