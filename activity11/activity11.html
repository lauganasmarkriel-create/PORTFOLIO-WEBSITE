<!DOCTYPE html>
<html>
    <head>
        <title>Activity 11</title>
        <script src="script.js"></script>
    </head>
    <body>
        <div>
        <h2>For Loop</h2>
        <form id="forloop">
            <label for="forNum">Number: </label>
            <input type="text" id="forNum" name="forNum"> <br><br>
            <label for="forText">Text: </label>
            <input type="text" id="forText" name="forText"> <br><br>
            <button type="button" onclick="showForLoop()">Show Output</button>
            <button type="reset" onclick="clearForLoop()">Clear</button>
        </form>
        <div id="forOutput"></div>
        </div>

        <div>
        <h2>While Loop</h2>
        <form id="whileloop">
            <label for="whileNum">Number: </label>
            <input type="text" id="whileNum" name="whileNum"> <br><br>
            <label for="whileText">Text: </label>
            <input type="text" id="whileText" name="whileText"> <br><br>
            <button type="button" onclick="showWhileLoop()">Show Output</button>
            <button type="reset" onclick="clearWhileLoop()">Clear</button>
        </form>
        <div id="whileOutput"></div>
        
        </div>
        <div>
        <h2>Do-While Loop</h2>
        <form id="dowhileloop">
            <label for="doWhileNum">Number: </label>
            <input type="text" id="doWhileNum" name="doWhileNum"> <br><br>
            <label for="doWhileText">Text: </label>
            <input type="text" id="doWhileText" name="doWhileText"> <br><br>
            <button type="button" onclick="showDoWhileLoop()">Show Output</button>
            <button type="reset" onclick="clearDoWhileLoop()">Clear</button>

        </form>
        <div id="doWhileOutput"></div>
        </div>

    
        
    </body>
</html>
